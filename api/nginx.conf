server {
    listen 5000;
    listen [::]:5000;

    client_max_body_size 512M;

    # Hashed build assets (eg /assets/index-XXXXXXXX.js) are content-addressed and
    # never change once built, so they're safe to cache indefinitely - but only as an
    # exact file match. Without this location, a request for an asset hash from a
    # since-replaced build would fall through to the SPA's index.html below (a 200
    # response with the wrong content type), which then gets cached at the edge and
    # breaks the app for anyone still holding that old index.html.
    location /assets/ {
        alias /home/openaddresses/api/web/dist/assets/;
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    location / {
        if ($request_uri ~ ^/(.*)\.html) {
            return 302 /$1;
        }

        alias /home/openaddresses/api/web/dist/;

        try_files $uri $uri.html $uri/ /index.html;
        add_header Cache-Control "no-store" always;

        autoindex on;
    }

    location /docs {
        proxy_pass http://127.0.0.1:4999;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /sitemap.xml {
        proxy_pass http://127.0.0.1:4999/sitemap.xml;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location ~ ^/api(?:/(.*))?$ {
        proxy_pass http://127.0.0.1:4999;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
